# ta-screener settings. Unknown keys are rejected (typos would be silent bugs).

paths:
  # Both are gitignored: TradingView data may not be redistributed.
  data: data
  logs: logs

tradingview:
  # TradingView's official MCP server (OAuth 2.1, needs a paid TradingView plan).
  # Sign in once with:  .venv\Scripts\python.exe run.py --auth-tradingview
  # Sign in on tradingview.com in your default browser FIRST: TradingView's CDN
  # blocks its sign-in page when it is reached as a redirect from the approval URL.
  url: "https://mcp.tradingview.com/mcp"
  # Holds a refresh token — kept in your user folder, outside the project.
  token_path: "~/.ta-screener/tv_tokens.json"
  # Where the browser is sent back after sign-in. The port is registered with
  # TradingView on the first sign-in; 8765 belongs to market-research-pipeline.
  callback_host: "localhost"
  callback_port: 8766
  # Seconds to wait between retries when TradingView answers 429 (rate limit).
  rate_limit_delays: [5, 15, 45]

universe:
  # US stocks above this market cap (USD), from TradingView's screener.
  # $5B (owner, 2026-09-28; was $1B): the scan, the live watch and the pre-market reports.
  market: "america"
  min_market_cap: 5.0e9
  # The screener has no paging, so the universe is fetched in market-cap bands;
  # a band holding more than row_cap is split automatically. The last band is
  # open-ended.
  band_edges: [5.0e9, 1.0e10, 3.0e10, 1.0e11]
  # Rows per call. The tool allows 1000, but the MCP server refuses results over
  # 1 MB (live: roughly 430 rows). An answer that is too big splits its band too.
  row_cap: 400
  # The screener's "stock" results include OTC listings; these prefixes are dropped.
  drop_exchanges: ["OTC"]
  # Preferred issues carry the parent's market cap and trade like bonds.
  drop_subtypes: ["preferred"]
  # If the screener is rate limited (429), --update goes on with the newest saved
  # universe when it is at most this many days old.
  max_age_days: 7

bars:
  history: 600               # daily bars on first fetch (~2.4 years)
  overlap: 5                 # bars re-fetched on update; must match what is stored
  overlap_tolerance_pct: 0.05
  session_batch: 100         # new MCP session every N symbols (tokens last 15 min)
  concurrency: 1             # calls in flight at once
  min_interval_s: 0.0        # pause after each call

market:
  timezone: "America/New_York"
  # Today's daily bar is used only after this New York time (after the close
  # auction has printed); before it, the bar is a partial session and is dropped.
  session_close: "16:15"

live:
  # The session's breakout watch (run.py --ci-live) keeps going this long after the close
  # (TradingView's quotes are delayed).
  after_close_minutes: 20

claude:
  # Claude Code for the chart analyst, through your subscription (`claude -p`, which must
  # run from a normal terminal or a workflow, not from inside Claude Code). The site and
  # its discussion channels were removed on 2026-09-27: Telegram only.
  model: "sonnet"
  timeout_s: 600

outcomes:
  # What happened after each chart-pattern breakout (the scorecard page). Our own
  # definitions, not the book's statistics: target = the measure-rule target was
  # reached; failed = a close beyond the pattern's invalidation level first.
  max_sessions: 60           # after this many sessions without either: "no decision"
  min_cases: 20              # percentages only from this many decided breakouts
  # run.py --backfill-outcomes: the detector on past bars, one session at a time
  # (step 1 = what the daily scans would have seen), without looking ahead.
  backfill_step: 1
  backfill_min_bars: 150     # start once a stock has this much history
  backfill_workers: 4        # parallel processes (this computer has 8 cores)

alerts:
  # Telegram alerts on bullish chart-pattern breakouts (owner's request, 2026-09-24):
  # after the close, the day's confirmed breakouts and the patterns on the verge of one;
  # during the session, a price crossing a breakout line (not final until the close).
  enabled: true
  verge_pct: 2.0             # "on the verge": the close this far below the breakout line
  watch_pct: 5.0             # watched during the session: the line this far above the close
  top_analyses: 3            # full analyses for the strongest breakouts (of the 10 a day)
  live_interval_minutes: 5   # a price pass during the session (owner: as close to real time
                             # as TradingView allows; get-ohlcv, one call a stock)
  far_every: 3               # stocks beyond verge_pct from their line: every 3rd pass only
  live_max_symbols: 120      # stocks watched, at most, nearest to their line first
  # Meaningful and varied breakouts (owner, 2026-09-28: "mostly wedges"). Only patterns
  # whose past bullish breakouts in our ledger reached the target at least this often
  # (failed and expired count against). 35 left five patterns and, with the $5B floor, no
  # alert at all (2026-09-29: one candidate); at 25 only flags, pennants and high tight
  # flags stay out (owner, 2026-09-30: "no breakout messages at all"). The live watch and
  # the evening research team both use it; at most live_per_pattern of one a session.
  min_success_pct: 25
  live_min_above_pct: 0.5    # in the session: the price this far above the line, not a touch
  live_per_pattern: 2        # alerts of one pattern a session, at most
  # Big moves before the open (owner, 2026-09-28): at 07:30, 08:30 and 09:15 New York
  # time (14:30, 15:30, 16:15 Israel time in summer), the $5B+ stocks moving at least
  # premarket_min_pct since the last close on at least premarket_min_volume shares, and
  # any above a forming pattern's breakout line. Pre-market prices, never a breakout.
  premarket: true
  premarket_min_pct: 4
  premarket_min_volume: 300000   # owner, 2026-09-28: at least 300,000 shares before the open

xnews:
  # Breaking Wall Street news from X (owner's request, 2026-09-27): every 10 minutes
  # (.github/workflows/xnews.yml) the new posts of these accounts are read through
  # twitterapi.io (paid per post read), Claude picks only what matters for Wall Street,
  # and the bot sends a short Hebrew summary with a link. Account names without the @.
  enabled: true
  until: "2026-12-27"        # three months (owner, 2026-09-27); after it: one notice, then nothing
  accounts: [   # the owner's list, 2026-09-27
    unusual_whales, RyanDetrick, wallstengine, StockSavvyShay, cperruna, bespokeinvest,
    MikeZaccardi, DeItaone, gurgavin, DivesTech, garyblack00, topdowncharts,
    larryswedroe, DeanChristians, InvestingVisual, Mr_Derivatives, GinaMartinAdams,
    zerohedge, LizAnnSonders, charliebilello, KobeissiLetter, sentimentrader,
    Callum_Thomas, NorthmanTrader, TheChartReport, YardeniResearch, LukeGromen,
    jsblokland, Tier1alpha, MacroAlf, CrescatCapital, GrantWilliams11, WolfStreet,
    TheBondFreak, markets, CNBC, Bloomberg, WSJmarkets, FT, ReutersBiz, DavidInglesTV,
    RampCapitalLLC, julius_fox, RealVision, SchwabResearch, GoldmanSachs, JPMorgan,
    MorganStanley, BofA_Merrill, Citi, UBS, Barclays, HSBC, Fidelity, Vanguard_Group,
    BlackRock, StateStreet, InvescoUS, PIMCO, TrowePrice, JanusHenderson, ARKInvest,
    CathieDWood]
  min_importance: 3          # 1-5: 5 = market-moving now, 4 = relevant to specific stocks today,
                             # 3 = a useful Wall Street update (owner, 2026-09-28: not only the dramatic)
  weekend_min_importance: 4  # Saturday and Sunday: only the dramatic, and what matters for the week
  # The owner keeps the cost where it was before the hours grew (2026-09-28): 2,000 posts
  # a day at most (about 0.30 USD), so a month stays around 5-7 USD
  daily_read_cap: 2000
  with_replies: false
  # Claude's share of the subscription (also used by the chart analyses), kept at the
  # earlier 45 a day: the posts are read every 10 minutes, but judged together every
  # 30 minutes at most (the 20-hour window 07:00-03:00 Israel time fits 40)
  claude_daily_cap: 45
  claude_every_minutes: 30
  # Few, hand-picked stories (owner, 2026-09-28: "not a story from every scan"): at most
  # max_per_round a round (the most important), and daily_max regular ones a day, spread
  # over the news hours. A 5 (market-moving now) always goes.
  # owner, 2026-10-01: "more sensitive to market news": 3 a round, 18 a day (was 2 / 12);
  # the same reads and Claude calls, only more of the judged stories go out
  # owner, 2026-10-01 (later): "more updates on companies, a bit more often": 4 a round,
  # 30 a day, and within one importance a story that names a company goes first
  max_per_round: 4
  daily_max: 30
  # Once a week the reader's balance is looked at; below this (USD) the bot warns with a
  # top-up link (owner, 2026-09-28). 0 turns it off.
  low_balance_usd: 2
  model: "sonnet"
  effort: "low"
  timeout_s: 300

explain:
  # Why the market moves (owner, 2026-09-28): Claude reads the index funds, the biggest
  # movers and the last hours of X news, and writes a few Hebrew sentences: in each
  # pre-market report, and when SPY or QQQ moves sharply in the session.
  enabled: true
  news_hours: 3              # how far back the X news goes
  day_move_pct: 1.0          # SPY or QQQ this far from the last close
  hour_move_pct: 0.7         # ...or this much within about an hour
  max_per_day: 3             # session explanations a day, at most
  min_gap_minutes: 45
  model: "sonnet"
  effort: "low"
  timeout_s: 300

research:
  # The breakout research team (owner, 2026-09-28): every evening three specialists and a
  # chief strategist (tascreen/agents/) research the day's breakouts and verge candidates
  # and send only the best, at most max_picks (or none). They learn weekly from how their
  # picks ended. If the research fails, the regular report goes out with a note.
  enabled: true
  # owner, 2026-09-30: "up to ten stocks that broke out or have a really good setup" (it
  # was 3 of 8); the candidates are the day's breakouts and the setups up to watch_pct
  # below their line, at most 4 of one pattern in the shortlist and 2 in the picks
  shortlist: 20              # candidates researched in depth (by a transparent score)
  max_picks: 10
  # owner, 2026-09-30 ("I barely get stocks"; a weak week left one breakout a day): the
  # breakouts of the last recent_days sessions that still close above their line, and at
  # least min_picks a day when the shortlist has them (the chief's, then the best-scored rest)
  min_picks: 3
  recent_days: 3
  model: "sonnet"
  effort: "high"
  timeout_s: 900

watchlist:
  # The owner's own TradingView watchlist, followed closely (owner, 2026-09-30): priced every
  # pass of the live watch, any of its stocks' patterns crossing a line, a move of move_pct
  # from the last close (then each further move_pct), and X news about them; all to the
  # owner's PRIVATE chat. Only the list's id is here; its symbols stay in the private state
  # repo (data/watchlist.json), read from TradingView once a trading day.
  enabled: true
  id: "170201612"
  move_pct: 4

setups_list:
  # The bot's own TradingView watchlist (owner, 2026-10-02): the research team's picks go in
  # every evening, as a setup or a fresh breakout; what did not work out leaves (closed back
  # below the line, drifted away, the pattern vanished, no breakout in time), and so does
  # what reached its target or is no longer fresh. Changes go to the owner's PRIVATE chat.
  # The symbols stay in the private state repo (data/setups_list.json); only the id is here.
  enabled: true
  id: "349311195"
  max_size: 40
  max_gap_pct: 8
  setup_sessions: 15
  breakout_sessions: 10
