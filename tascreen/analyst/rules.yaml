# Thresholds of the chart analyst (tascreen/analyst). Each value says where it comes
# from: "common" = the usual textbook setting (see knowledge/*.md for sources),
# "ours" = a choice made for this engine. Changing a value changes every analysis.
window_sessions: {value: 250, origin: ours, note: "sessions analysed and drawn (about a year)"}
atr_period: {value: 14, origin: common}

# turning points (pivots.zigzag): a swing of this many ATRs
minor_pivot_atr: {value: 1.5, origin: ours, note: "for support/resistance zones, trendlines, divergences"}
major_pivot_atr: {value: 4.0, origin: ours, note: "for the Fibonacci swing"}

# support and resistance zones: clusters of turning points
zone_merge_atr: {value: 0.6, origin: ours, note: "turning points this close (in ATRs) form one zone"}
zone_max_width_atr: {value: 1.0, origin: ours, note: "a zone never spans more (no chaining of nearby points)"}
zone_min_touches: {value: 2, origin: common, note: "a level tested twice or more"}
zone_min_width_atr: {value: 0.25, origin: ours}
zones_each_side: {value: 3, origin: ours, note: "nearest zones above and below the price"}

# trendlines through turning points
trendline_min_touches: {value: 3, origin: common, note: "two points make a line, the third confirms it"}
trendline_touch_atr: {value: 0.35, origin: ours}
trendline_break_atr: {value: 0.5, origin: ours, note: "broken on a close this far beyond (not a wick)"}
trendline_recent_sessions: {value: 40, origin: ours, note: "its last touch must be this recent"}
trendline_max_distance_atr: {value: 6, origin: ours, note: "a line this far from the price today is not drawn"}

# Fibonacci (retracements of the last major swing, and its extensions)
fib_retracements: {value: [0.236, 0.382, 0.5, 0.618, 0.786], origin: common}
fib_extensions: {value: [1.272, 1.618], origin: common}

# indicators
rsi_period: {value: 14, origin: common}
rsi_overbought: {value: 70, origin: common}
rsi_oversold: {value: 30, origin: common}
macd: {value: [12, 26, 9], origin: common}
divergence_recent_sessions: {value: 10, origin: ours, note: "the second turning point must be this recent (review round 1: an older one had already played out)"}
ma_periods: {value: [50, 150, 200], origin: ours, note: "150 replaces 200 elsewhere on the site; 200 is kept here for the classic stack"}

# volume
volume_profile_bins: {value: 40, origin: ours}
value_area: {value: 0.70, origin: common}
volume_trend_short: {value: 20, origin: ours}
volume_trend_long: {value: 50, origin: ours}

# the simple view (view.py): what the chart and the Pine Script show by default
view_zones_each_side: {value: 2, origin: ours, note: "the nearest support and resistance zones drawn (owner: simple, to the point)"}
view_fib_levels: {value: [0.382, 0.5, 0.618], origin: common, note: "the main retracements only"}
view_fib_when_retraced: {value: [0.2, 0.85], origin: ours, note: "Fibonacci is shown while the price is inside a pullback of the last big move"}
view_vp_poc_within_atr: {value: 3, origin: ours, note: "the volume profile is shown when its POC is this close to the price"}
view_confluence_atr: {value: 0.0, origin: ours, note: "a Fibonacci level or the POC inside a drawn zone joins the zone's label (review round 1: a level just outside was named as the zone)"}

# review round 1 (2026-09-25): the headline missed the story, extremes were not levels,
# scenario levels sat too close, the Fibonacci swing was stale or tiny
fib_min_atr: {value: 3.0, origin: ours, note: "a swing smaller than this (in ATRs) gets no Fibonacci"}
fib_min_bars: {value: 10, origin: ours, note: "nor one shorter than this many sessions"}
event_fresh_sessions: {value: 10, origin: ours, note: "a pattern breakout this recent is the key event"}
event_near_extreme_pct: {value: 3.0, origin: ours, note: "within this of the 52-week high or low is the key event"}
event_big_move_pct: {value: 15.0, origin: ours, note: "a 20-session move this large is the key event"}
scenario_min_gap_atr: {value: 1.0, origin: ours, note: "a next level closer than this to its trigger is skipped"}
extreme_draw_pct: {value: 10.0, origin: ours, note: "the 52-week high or low is drawn when this close to the price"}
scenario_band_max_atr: {value: 1.5, origin: ours, note: "levels join into one band only up to this width (no chains of near levels)"}

# review round 2 (2026-09-25): new highs and zone breaks were missed, a retest read as a
# failure, cancel levels sat on their triggers, ranges and pullbacks had no headline
stretch_atr: {value: 3.0, origin: ours, note: "this many ATRs from the 50-day average: the price is stretched"}
congestion_ma_spread_pct: {value: 2.0, origin: ours, note: "the 50/150/200 averages within this of each other: no trend, a range"}
range_sessions: {value: 120, origin: ours, note: "the range a congested stock has traded in (about six months)"}
retest_away_atr: {value: 1.0, origin: ours, note: "after moving this far past the broken line, a return to within 1 ATR of it is a retest"}
new_extreme_sessions: {value: 5, origin: ours, note: "a 52-week high or low this recent is news"}
pullback_ma50_atr: {value: 1.0, origin: ours, note: "an uptrend's price within this of a rising 50-day average: a pullback to it"}
scenario_cancel_min_atr: {value: 1.0, origin: ours, note: "a cancel level at least this far from its trigger, from a real level (review round 2: cancel = trigger)"}
scenario_merge_atr: {value: 0.4, origin: ours, note: "levels this close join one band whatever its width (touching zones)"}
closer_min_atr: {value: 0.5, origin: ours, note: "the price is 'closer' to one side only when the gap differs by this much"}
view_trendline_atr: {value: 2.0, origin: ours, note: "a trendline of 3+ touches this close to the price is drawn and is a level"}
