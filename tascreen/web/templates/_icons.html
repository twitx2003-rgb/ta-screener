{# Line icons (24x24, stroke = currentColor): the personas' avatars and the logo. #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "book" -%}
  <path d="M3 5.5c3-1.2 6-1.2 9 .8 3-2 6-2 9-.8v13c-3-1.2-6-1.2-9 .8-3-2-6-2-9-.8z"/><path d="M12 6.3v13"/>
{%- elif name == "trend" -%}
  <path d="M3 17l5.5-6 4 4L20 7"/><path d="M14.5 7H20v5.5"/>
{%- elif name == "sprout" -%}
  <path d="M12 21v-8.5"/><path d="M12 12.5C12 8.4 9.1 5.5 4 5.5c0 4.1 3 7 8 7z"/><path d="M12 14.5c0-4.1 2.9-7 8-7 0 4.1-3 7-8 7z"/>
{%- elif name == "magnifier" -%}
  <circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/><path d="M8.3 9a2.3 2.3 0 0 1 4.4.9c0 1.4-2.2 1.8-2.2 2.9"/><path d="M10.5 14.6h.01"/>
{%- elif name == "bars" -%}
  <path d="M4 20v-5"/><path d="M9 20V9"/><path d="M14 20v-8"/><path d="M19 20V4"/>
{%- elif name == "waves" -%}
  <path d="M3 16c3-6.5 6-6.5 9 0s6 6.5 9 0"/><path d="M3 9.5c3 4 6 4 9 0s6-4 9 0" opacity=".55"/>
{%- elif name == "menu" -%}
  <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
{%- elif name == "bot" -%}
  <rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4"/><circle cx="12" cy="3.5" r="1"/><path d="M9 13h.01"/><path d="M15 13h.01"/><path d="M9.5 16.5h5"/>
{%- elif name == "logo" -%}
  <path d="M7 4v16"/><rect x="5" y="8" width="4" height="7" rx="1" fill="currentColor"/><path d="M17 3v18"/><rect x="15" y="6" width="4" height="10" rx="1"/><path d="M12 9v9"/><rect x="10" y="11" width="4" height="4" rx="1" fill="currentColor"/>
{%- else -%}
  <path d="M4 5h16v11H9l-5 4z"/>
{%- endif -%}
</svg>
{%- endmacro %}
