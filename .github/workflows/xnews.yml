# Breaking Wall Street news from X (owner's request, 2026-09-27): every 10 minutes the
# new posts of config.yaml's xnews.accounts are read through twitterapi.io (paid per post),
# Claude Code picks only what matters (the owner's subscription), and the bot sends a
# short Hebrew summary with a link. What was seen is kept on the "xnews" branch of the
# PRIVATE state repository. This repository is public, and so is this log: it shows one
# line of counts, never a post.
name: xnews

on:
  schedule:
    # Mon-Fri, 10:00-23:50 UTC (about 06:00-20:00 New York: pre-market to after-hours).
    # GitHub may start a scheduled run a few minutes late; the search overlaps the last one.
    - cron: "*/10 10-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xnews            # its own group: never waits for, or delays, the nightly run
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STATE_REPO: twitx2003-rgb/ta-screener-state
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install -q -r requirements.txt
          curl -fsSL https://claude.ai/install.sh | bash > /dev/null 2>&1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Get what was seen
        run: bash .github/xnews.sh restore

      - name: Read, pick, send
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$X_API_KEY" ]; then echo "xnews: no X_API_KEY secret yet, nothing read"; exit 0; fi
          set +e
          python -u run.py --xnews > "$RUNNER_TEMP/xnews.log" 2>&1
          code=$?
          line=$(grep -h '^xnews: ' "$RUNNER_TEMP/xnews.log" | tail -n 1)
          # errors by class name only: a message could quote a post
          err=$(grep -ho 'ERROR' "$RUNNER_TEMP/xnews.log" | head -n 1)
          echo "${line:-xnews: no status line${err:+ (an error; exit $code)}}"
          exit $code

      - name: Keep what was seen
        if: always()
        run: bash .github/xnews.sh keep
