# Breaking Wall Street news from X (owner's request, 2026-09-27): every 10 minutes the
# new posts of config.yaml's xnews.accounts are read through twitterapi.io (paid per post),
# Claude Code picks only what matters (the owner's subscription), and the bot sends a
# short Hebrew summary with a link. What was seen is kept on the "xnews" branch of the
# PRIVATE state repository. This repository is public, and so is this log: it shows one
# line of counts, never a post.
name: xnews

on:
  # GitHub's schedule is not reliable (2026-09-28: nothing fired from Saturday to Monday
  # noon), so one run loops: a pass every 10 minutes (20 on the weekend) for 5.5 hours,
  # then it starts its own continuation. These hourly starts only revive a broken chain:
  # while a loop runs they wait in the "xnews" group, and a newer one replaces them.
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      digest_trial:
        description: "Only try the morning digest now, sent to the owner's private chat (not recorded)"
        type: boolean
        default: false
      check_vision:
        description: "Only check the picture explanations (one real post picture -> Telegram)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # its own group: never waits for, or delays, the nightly run; a digest trial runs beside the loop
  group: ${{ inputs.digest_trial && 'xnews-digest-trial' || 'xnews' }}
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      STATE_REPO: twitx2003-rgb/ta-screener-state
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install -q -r requirements.txt
          curl -fsSL https://claude.ai/install.sh | bash > /dev/null 2>&1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Get what was seen
        run: bash .github/xnews.sh restore

      # a story without a photo gets a drawn picture, with the named stock's candles
      # (owner, 2026-10-10); without the bars the picture goes without a chart
      - name: Get the stored bars
        run: bash .github/xnews.sh bars

      - name: Read, pick, send (a pass every 10 minutes for 5.5 hours)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          CHECK_VISION: ${{ inputs.check_vision }}
          DIGEST_TRIAL: ${{ inputs.digest_trial }}
        run: |
          if [ "$DIGEST_TRIAL" = "true" ]; then
            python -u run.py --digest-trial > "$RUNNER_TEMP/digest.log" 2>&1
            code=$?
            grep -h '^digest: ' "$RUNNER_TEMP/digest.log" | tail -n 1
            exit $code
          fi
          if [ "$CHECK_VISION" = "true" ]; then
            python -u run.py --x-vision-check > "$RUNNER_TEMP/xnews.log" 2>&1
            code=$?
            grep -h '^vision: ' "$RUNNER_TEMP/xnews.log" | tail -n 1
            exit $code
          fi
          end=$(( $(date +%s) + 330 * 60 ))
          while :; do
            hour=$((10#$(date -u +%H)))
            if [ -n "$X_API_KEY" ] && [ "$hour" -ge 4 ]; then    # 07:00-03:00 Israel time
              python -u run.py --xnews > "$RUNNER_TEMP/xnews.log" 2>&1
              line=$(grep -h '^xnews: ' "$RUNNER_TEMP/xnews.log" | tail -n 1)
              echo "$(date -u +%H:%M) ${line:-xnews: no status line (an error)}"
              bash .github/xnews.sh keep > /dev/null || echo "xnews state: could not keep"
            fi
            python -u run.py --ensure-live 2> /dev/null | grep -h '^ensure-live: ' || true
            python -u run.py --ensure-nightly 2> /dev/null | grep -h '^ensure-nightly: ' || true
            # the morning digest at 10:00 Israel time (tascreen/digest.py): a no-op when not due
            if python -u run.py --digest 2> "$RUNNER_TEMP/digest.log" | grep -h '^digest: ' | grep -v 'not due'; then
              bash .github/xnews.sh keep > /dev/null || echo "xnews state: could not keep"
            fi
            step=600
            if [ "$(date -u +%u)" -ge 6 ]; then step=1200; fi
            if [ $(( $(date +%s) + step )) -ge "$end" ]; then break; fi
            sleep "$step"
          done
          python -c "from tascreen import github; print('continuation:', github.dispatch('xnews.yml', {}))"

      - name: Keep what was seen
        if: always() && inputs.check_vision != true && inputs.digest_trial != true
        run: bash .github/xnews.sh keep
