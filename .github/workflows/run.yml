# The pipeline on GitHub Actions (owner-approved plan, 2026-09-24: GitHub Actions + Vercel).
# Each run does what is due now (run.py --ci-tick): after a session closes, the daily
# update (universe, bars, scan, outcome ledger) and the channels. The working state
# (TradingView sign-in, data, full logs) lives in the PRIVATE repository
# twitx2003-rgb/ta-screener-state. This repository is public, and so is this log: it
# shows only logs/ci_summary.json (dates, counts, error class names).
# Scheduled since the home computer stopped (stage 3, 2026-09-24). Several start times:
# GitHub delays or drops scheduled runs, and each run only does what is still due.
name: run

on:
  schedule:
    - cron: "40 21 * * 1-5"      # after the close (16:15 New York), summer and winter
    - cron: "10 1 * * 2-6"       # catch-ups: finish an update that was cut short
    - cron: "10 5 * * 2-6"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the N largest stocks (a test run; empty = all)"
        default: ""
      channels:
        description: "Write the channels (uses the Claude subscription)"
        type: boolean
        default: false
      save:
        description: "Save the data to the state repository (off = a test: only the token and logs are kept)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: state            # one run at a time uses the state and the TradingView token
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      STATE_REPO: twitx2003-rgb/ta-screener-state
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
      TA_TV_TOKEN_PATH: ${{ github.workspace }}/state/tv_tokens.json
      TA_STATE_DIR: ${{ github.workspace }}/state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install -q -r requirements.txt
          curl -fsSL https://claude.ai/install.sh | bash > /dev/null 2>&1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore the private state
        run: bash .github/state.sh restore

      - name: Do what is due
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          CHANNELS: ${{ github.event_name == 'schedule' || inputs.channels }}
        run: |
          set +e
          args=(--ci-tick --max-minutes 300)
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          if [ "$CHANNELS" != "true" ]; then args+=(--no-channels); fi
          rm -f state/logs/ci_summary.json state/logs/site-url.txt
          python -u run.py "${args[@]}" > "state/logs/tick-$(date -u +%Y%m%dT%H%M).log" 2>&1
          code=$?
          python .github/mask_tokens.py state/tv_tokens.json
          cat state/logs/ci_summary.json 2> /dev/null || echo "no summary (see the log in the state repository)"
          exit $code

      - name: Publish the site to Vercel
        id: publish
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.save) }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_CLI: vercel@59.26.0
          # run-time keys of the site's Telegram webhook function (api/telegram.js); they
          # stay GitHub secrets, handed to each deployment and never stored in the project
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          site="$RUNNER_TEMP/ta-screener"
          logs="$GITHUB_WORKSPACE/state/logs"
          python run.py --export-site "$site" > "$logs/export.json" 2> "$logs/export-stderr.txt" || { echo "export failed (see the state repository)"; exit 1; }
          cat "$logs/export.json"
          cd "$site"
          started=$(date +%s)
          npx --yes "$VERCEL_CLI" link --yes --project ta-screener --token "$VERCEL_TOKEN" > "$logs/vercel-link.txt" 2>&1
          npx --yes "$VERCEL_CLI" deploy --prod --yes --token "$VERCEL_TOKEN" \
              -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" -e TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID" \
              -e GH_DISPATCH_TOKEN="$GH_DISPATCH_TOKEN" > deploy-url.txt 2> "$logs/vercel-deploy.txt"
          code=$?
          echo "deploy exit $code after $(( $(date +%s) - started )) s"
          npx --yes "$VERCEL_CLI" inspect "$(tail -n 1 deploy-url.txt)" --token "$VERCEL_TOKEN" > "$logs/vercel-inspect.txt" 2>&1 || true
          grep -ho 'https://[a-z0-9.-]*\.vercel\.app' "$logs/vercel-inspect.txt" deploy-url.txt | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d' ' -f2 | tee "$logs/site-url.txt"
          exit $code

      - name: Point the Telegram bot at the site
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_DISPATCH_TOKEN" ]; then echo "webhook: no GH_DISPATCH_TOKEN secret yet, the bot stays silent"; exit 0; fi
          python run.py --telegram-webhook "https://ta-screener.vercel.app/api/telegram/" 2> /dev/null || echo "webhook: not set"

      - name: Tell the owner (Telegram)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: python run.py --ci-notify "$STATUS" 2> /dev/null || true

      - name: Save the state
        if: always()
        env:
          SAVE: ${{ github.event_name == 'schedule' || inputs.save }}
        run: |
          if [ ! -d state/.git ]; then echo "no state checkout: nothing to save"; exit 0; fi
          if [ "$SAVE" = "true" ]; then bash .github/state.sh save; else bash .github/state.sh save-token; fi
